name: Build

on:
  push:
    branches: [prod]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Valheim server files
        uses: actions/cache@v4
        with:
          path: serverfiles
          key: valheim-server-896660

      - name: Install SteamCMD
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lib32gcc-s1
          mkdir -p steamcmd
          curl -fsSL -o steamcmd.tar.gz https://cdn.cloudflare.steamstatic.com/client/installer/steamcmd_linux.tar.gz \
            || curl -fsSL -o steamcmd.tar.gz https://media.steampowered.com/installer/steamcmd_linux.tar.gz \
            || curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar zxf steamcmd.tar.gz -C steamcmd
          ./steamcmd/steamcmd.sh +quit || true   # first run self-updates; its exit code is unreliable

      - name: Download Valheim dedicated server (game assemblies)
        run: |
          ok=0
          for i in 1 2 3; do
            ./steamcmd/steamcmd.sh +force_install_dir "$PWD/serverfiles" +login anonymous +app_update 896660 validate +quit && ok=1 && break
            echo "steamcmd attempt $i failed, retrying in 15s"; sleep 15
          done
          test "$ok" = "1"
          test -d serverfiles/valheim_server_Data/Managed
          mkdir -p Managed
          cp serverfiles/valheim_server_Data/Managed/*.dll Managed/
          echo "copied $(ls Managed | wc -l) assemblies"

      - name: Download modding dependencies (pinned versions)
        run: |
          mkdir -p deps libs
          curl -sSL -o deps/bepinex.zip https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2333/
          curl -sSL -o deps/jotunn.zip  https://thunderstore.io/package/download/ValheimModding/Jotunn/2.29.2/
          curl -sSL -o deps/muc.zip     https://thunderstore.io/package/download/MSchmoecker/MultiUserChest/0.6.1/
          for z in deps/*.zip; do unzip -oq "$z" -d "${z%.zip}"; done
          find deps -name BepInEx.dll        -exec cp {} libs/ \;
          find deps -name 0Harmony.dll       -exec cp {} libs/ \;
          find deps -name Jotunn.dll         -exec cp {} libs/ \;
          find deps -name MultiUserChest.dll -exec cp {} libs/ \;
          ls -la libs/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet build src/ChestButler/ChestButler.csproj -c Release
          find dist -type f ! -name 'ChestButler.dll' ! -name 'ChestButler.pdb' -delete
          ls -la dist/

      - name: Read version
        id: ver
        run: |
          CSPROJ=$(grep -oPm1 '(?<=<Version>)[^<]+' src/ChestButler/ChestButler.csproj)
          PLUGIN=$(grep -oPm1 '(?<=ModVersion = ")[^"]+' src/ChestButler/Plugin.cs)
          MANIFEST=$(grep -oPm1 '(?<="version_number": ")[^"]+' pkg/manifest.json)
          echo "csproj=$CSPROJ plugin=$PLUGIN manifest=$MANIFEST"
          if [ "$CSPROJ" != "$PLUGIN" ] || [ "$CSPROJ" != "$MANIFEST" ]; then
            echo "::error::Version mismatch between csproj ($CSPROJ), Plugin.cs ($PLUGIN) and manifest.json ($MANIFEST)"
            exit 1
          fi
          echo "version=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Package Thunderstore zip
        run: |
          cp dist/ChestButler.dll pkg/
          cp LICENSE pkg/
          cd pkg && zip -q "../ChestButler-${{ steps.ver.outputs.version }}.zip" manifest.json icon.png README.md CHANGELOG.md LICENSE ChestButler.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChestButler-dll-${{ steps.ver.outputs.version }}
          path: |
            dist/ChestButler.dll
            dist/ChestButler.pdb

      - name: Upload Thunderstore package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChestButler-thunderstore-${{ steps.ver.outputs.version }}
          path: ChestButler-${{ steps.ver.outputs.version }}.zip

      - name: Publish release
        if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ChestButler ${{ steps.ver.outputs.version }}
          files: |
            dist/ChestButler.dll
            ChestButler-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true

      - name: Check if this version is already on Thunderstore
        id: tscheck
        run: |
          latest=$(curl -sf "https://thunderstore.io/api/experimental/package/EK_Solutions/ChestButler/" | jq -r '.latest.version_number' 2>/dev/null || echo none)
          echo "Thunderstore latest=$latest  building=${{ steps.ver.outputs.version }}"
          if [ "$latest" = "${{ steps.ver.outputs.version }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ steps.ver.outputs.version }} already on Thunderstore; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Thunderstore
        if: (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')) && steps.tscheck.outputs.publish == 'true'
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          namespace: EK_Solutions
          name: ChestButler
          version: ${{ steps.ver.outputs.version }}
          community: valheim
          repo: https://thunderstore.io
          description: "Dump-and-sort chests: flag a chest as a Sorter and loot flies to the right chests. One-press Organize tidies the whole base and remembers each chest's role. Gather pulls recipe ingredients to the bench. Multiplayer-safe via MultiUserChest."
          file: ChestButler-${{ steps.ver.outputs.version }}.zip
          token: ${{ secrets.TCLI_AUTH_TOKEN }}
